<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Rain</title>

<style>
    /* General Setup */
    body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: white;
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }

    /* Large Background Heart */
    .main-heart {
        font-size: 200px; /* Reduced slightly to fit text later */
        color: #ff2d55;
        text-shadow: 0 0 20px #ff2d55;
        position: absolute;
        z-index: 1;
        transition: all 0.5s ease;
        animation: heartbeat 0.8s infinite;
        text-align: center;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    /* Button Container */
    .btn-container {
        position: relative;
        z-index: 10;
        display: flex;
        gap: 20px;
        margin-top: 250px;
    }

    button {
        padding: 15px 30px;
        font-size: 1.5rem;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        background-color: #ff2d55;
        color: white;
    }

    /* Success Message Class */
    .success-message {
      text-transform: uppercase;
      font-family: 'Dancing Script', cursive;
        font-size: 60px !important;
        font-weight: 900;
        color: #44FF00 !important;
        text-shadow: 0 0 20px #88FF00, 0 0 30px #44FF00;
        animation: appear 0.8s forwards ease-out, move 2s ease-in-out infinite !important;
    }

    @keyframes appear {
        from { opacity: 0; transform: scale(0.5); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes move {
        0%, 100% { transform: translateY(0px) rotate(-5deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
    }

    .heart-particle {
        position: absolute;
        top: -50px;
        font-size: 20px;
        animation: fall linear infinite;
    }

    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }
</style>
<body>
<div class="main-heart">💗</div>

<div class="btn-container">
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
</div>

<script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const mainHeart = document.querySelector('.main-heart');
    let toggleState = false;

    function alternateButtons(e) {
        // If it's already green (toggleState is true) and user clicks YES
        if (toggleState && e.target.id === 'yesBtn') {
            celebrate();
            return;
        }

        if (!toggleState) {
            yesBtn.style.transform = "scale(1.4)";
            yesBtn.style.backgroundColor = "#44FF00";
            yesBtn.style.opacity = "1";

            noBtn.style.transform = "scale(0.8) translate(50px)";
            noBtn.style.opacity = "0.4";
            noBtn.style.backgroundColor = "#444";
        } else {
            noBtn.style.transform = "scale(1.4)";
            noBtn.style.backgroundColor = "#ff2d55";
            noBtn.style.opacity = "1";

            yesBtn.style.transform = "scale(0.8)";
            yesBtn.style.opacity = "0.4";
            yesBtn.style.backgroundColor = "#444";
        }
        toggleState = !toggleState;
    }

    function celebrate() {
        mainHeart.innerHTML = "I Knew It! 💞<br>Luv u 2!";
        mainHeart.classList.add('success-message');
        
        document.querySelector('.btn-container').style.display = "none";

        // Intense heart rain
        setInterval(createHeart, 1);
    }

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerHTML = '💝';
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }

    yesBtn.addEventListener('click', alternateButtons);
    noBtn.addEventListener('click', alternateButtons);
    setInterval(createHeart, 400);
</script>
</body>
</html>
